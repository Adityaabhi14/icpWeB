{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 sm:p-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-4">
                <i class="fas fa-lock text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to monitor and manage your personal expenses</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-user text-sm"></i>
                    </span>
                    <input type="text" name="identifier" id="identifier" required placeholder="alex_dev or alex@example.com"
                           class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-key text-sm"></i>
                    </span>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">
                </div>
            </div>

            <button type="submit"
                    class="w-full mt-2 py-3 px-4 rounded-xl font-bold text-sm bg-brand-600 text-white hover:bg-brand-700 shadow-md shadow-brand-500/25 transition active:scale-[0.99]">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-white px-3 text-slate-400 font-semibold">New to SpendWise?</span>
            </div>
        </div>

        <div class="text-center">
            <a href="{{ url_for('auth.register') }}"
               class="inline-block w-full py-2.5 px-4 rounded-xl font-semibold text-sm text-brand-700 bg-brand-50 hover:bg-brand-100 transition border border-brand-200">
                Create a Free Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
