{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center p-6">
    <div class="max-w-md w-full">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl mb-4">
            <i class="fas fa-bug"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">500 - Server Error</h1>
        <p class="text-slate-500 text-sm mt-2">An unexpected error occurred while processing your request. Please try again or check application logs.</p>
        <div class="mt-6">
            <a href="{{ url_for('analytics.dashboard') if g.user else url_for('auth.login') }}"
               class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-sm shadow hover:bg-brand-700 transition">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
