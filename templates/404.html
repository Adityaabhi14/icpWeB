{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center p-6">
    <div class="max-w-md w-full">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mb-4">
            <i class="fas fa-compass"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">404 - Page Not Found</h1>
        <p class="text-slate-500 text-sm mt-2">The page or expense record you are looking for doesn't exist or has been removed.</p>
        <div class="mt-6">
            <a href="{{ url_for('analytics.dashboard') if g.user else url_for('auth.login') }}"
               class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-sm shadow hover:bg-brand-700 transition">
                <i class="fas fa-arrow-left"></i> Return to Safe Ground
            </a>
        </div>
    </div>
</div>
{% endblock %}
